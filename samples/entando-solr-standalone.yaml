---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: solr-data
  labels:
    app: solr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solr
  labels:
    app: solr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: solr
    spec:
      containers:
        - name: solr
          image: entando/entando-solr:8.11.4
          ports:
            - containerPort: 8983
              name: solr
              protocol: TCP
          env:
            - name: SOLR_JAVA_MEM
              value: "-Xms1024m -Xmx1024m"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: solr-data
              mountPath: /var/solr
          readinessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: solr-data
          persistentVolumeClaim:
            claimName: solr-data
---
apiVersion: v1
kind: Service
metadata:
  name: solr
  labels:
    app: solr
spec:
  selector:
    app: solr
  ports:
    - port: 8983
      targetPort: 8983
      protocol: TCP
      name: solr